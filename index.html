<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente AI SYSEM</title>
  <script>
    if (window.location.hostname === 'sysem2025-crypto.github.io') {
      const targetBase = 'https://gianluca-ai-ten.vercel.app';
      const targetUrl = new URL(targetBase);
      window.location.replace(`${targetUrl.origin}${window.location.search}${window.location.hash}`);
    }
  </script>
  <script>
    (function() {
      if (new URLSearchParams(window.location.search).get('embed') === '1') {
        document.documentElement.classList.add('embed-mode');
      }
    })();
  </script>
  <style>
    :root {
      --ink: #17202a;
      --white: #f8fbff;
      --aqua: #2457d6;
      --accent: #18a999;
      --warm: #f0b84f;
      --glass: rgba(255, 255, 255, 0.72);
      --line: rgba(23, 32, 42, 0.14);
      --paper: #eef4fb;
      --paper-shadow: #d8e2ec;
      --paper-highlight: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
    }

    .embed-mode .topbar { display: none; }
    .embed-mode .overlay-menu { display: none; }
    .embed-mode .home { min-height: 100%; }
    .embed-mode .home::after { inset: 0; border: none; }
    .embed-mode .hero { min-height: 100%; padding: 16px 0 16px; }
    .embed-mode .hero-chat { padding: 4px 0 0; }
    .embed-mode .hero-chat .hero-overline,
    .embed-mode .hero-chat h1 { display: none; }
    .embed-mode .chat-layout { margin-top: 0; gap: 0; }
    .embed-mode .hero-home .hero-overline,
    .embed-mode .hero-home h1,
    .embed-mode .hero-home .hero-subtitle { display: none; }
    .embed-mode .hero-home { justify-content: flex-start; padding-top: 24px; }
    .embed-mode .register-card { box-shadow: none; }

    .embed-mode .chat-card { padding: 12px 14px; border-radius: 12px; }
    .embed-mode .chat-header { gap: 10px; padding-bottom: 10px; margin-bottom: 10px; }
    .embed-mode .chat-avatar { width: 38px; height: 38px; font-size: 16px; border-width: 1px; }
    .embed-mode .chat-header-info h2 { font-size: 15px; }
    .embed-mode .chat-header-info p { font-size: 11px; }
    .embed-mode .chat-header-info .header-user { font-size: 10px; margin-top: 2px; }
    .embed-mode .chat-status { font-size: 11px; }
    .embed-mode .status-dot { width: 7px; height: 7px; }
    .embed-mode .chat-exit-btn { font-size: 11px; padding: 6px 10px; margin-left: 8px; }
    .embed-mode .chat-box { gap: 10px; min-height: 0; max-height: none; padding: 6px 2px; }
    .embed-mode .message { gap: 8px; max-width: 92%; }
    .embed-mode .msg-avatar { width: 26px; height: 26px; font-size: 11px; }
    .embed-mode .bubble { font-size: 13px; line-height: 1.45; padding: 8px 12px; border-radius: 10px; }
    .embed-mode .timestamp { font-size: 9px; }
    .embed-mode .typing-indicator { padding: 8px 12px; }
    .embed-mode .typing-indicator span { width: 6px; height: 6px; }
    .embed-mode .input-area { gap: 8px; padding-top: 10px; }
    .embed-mode #userInput { font-size: 13px; padding: 10px 14px; border-radius: 10px; }
    .embed-mode #sendBtn { width: 38px; height: 38px; font-size: 15px; }
    .embed-mode .welcome { font-size: 12px; }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Verdana", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    a { color: inherit; text-decoration: none; }

    .home {
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(36, 87, 214, 0.16), transparent 34%),
        radial-gradient(circle at 88% 20%, rgba(24, 169, 153, 0.14), transparent 32%),
        radial-gradient(circle at 72% 88%, rgba(240, 184, 79, 0.18), transparent 38%),
        linear-gradient(145deg, var(--paper-highlight), var(--paper) 48%, var(--paper-shadow));
    }

    .home::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(23, 32, 42, 0.026) 0,
          rgba(23, 32, 42, 0.026) 1px,
          transparent 1px,
          transparent 22px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(23, 32, 42, 0.022) 0,
          rgba(23, 32, 42, 0.022) 1px,
          transparent 1px,
          transparent 22px
        );
      opacity: 0.46;
    }

    .home::after {
      content: "";
      position: absolute;
      inset: 92px 5.4% 56px;
      border: 1px solid rgba(23, 32, 42, 0.1);
      border-radius: 28px;
      pointer-events: none;
    }

    .topbar {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      position: relative;
      z-index: 2;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      min-height: clamp(58px, 7vw, 84px);
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      color: var(--ink);
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(58px, 7vw, 84px);
      height: clamp(58px, 7vw, 84px);
      border: 1px solid rgba(36, 87, 214, 0.34);
      border-radius: 18px;
      font-size: clamp(1.2rem, 3vw, 2rem);
      font-weight: 900;
      color: var(--white);
      background: linear-gradient(135deg, var(--aqua), var(--accent));
      box-shadow: 0 16px 40px rgba(36, 87, 214, 0.24);
    }

    .brand-logo img {
      display: block;
      width: 78%;
      height: 78%;
      object-fit: contain;
    }

    .brand-label {
      margin-left: 12px;
      display: grid;
      gap: 2px;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(23, 32, 42, 0.62);
    }

    .brand-label strong {
      display: block;
      color: var(--ink);
      font-size: 0.86rem;
      letter-spacing: 0.06em;
    }

    .sysem-back {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      background: rgba(255, 255, 255, 0.58);
      color: rgba(23, 32, 42, 0.68);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .sysem-back:hover {
      border-color: rgba(36, 87, 214, 0.34);
      background: rgba(255, 255, 255, 0.84);
      color: var(--aqua);
    }

    .nav-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
      min-height: clamp(58px, 7vw, 84px);
    }

    .nav-toggle {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 34px;
      height: 24px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 1001;
      padding: 0;
    }

    .nav-toggle span {
      display: block;
      width: 100%;
      height: 3px;
      background-color: var(--ink);
      border-radius: 10px;
      transition: all 0.3s ease-in-out;
    }

    .nav-toggle.active span:nth-child(1) {
      transform: translateY(10px) rotate(45deg);
    }

    .nav-toggle.active span:nth-child(2) {
      opacity: 0;
    }

    .nav-toggle.active span:nth-child(3) {
      transform: translateY(-11px) rotate(-45deg);
    }

    .overlay-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(244, 238, 223, 0.95);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .overlay-menu.active {
      opacity: 1;
      visibility: visible;
    }

    .overlay-menu nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: center;
    }

    .overlay-menu nav ul li {
      margin: 6px 0;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease-out;
    }

    .overlay-menu.active nav ul li {
      opacity: 1;
      transform: translateY(0);
    }

    .overlay-menu.active nav ul li:nth-child(1) { transition-delay: 0.05s; }
    .overlay-menu.active nav ul li:nth-child(2) { transition-delay: 0.08s; }
    .overlay-menu.active nav ul li:nth-child(3) { transition-delay: 0.11s; }
    .overlay-menu.active nav ul li:nth-child(4) { transition-delay: 0.14s; }
    .overlay-menu.active nav ul li:nth-child(5) { transition-delay: 0.17s; }
    .overlay-menu.active nav ul li:nth-child(6) { transition-delay: 0.20s; }
    .overlay-menu.active nav ul li:nth-child(7) { transition-delay: 0.23s; }

    .overlay-menu nav ul li.nav-category {
      margin: 18px 0 4px;
      pointer-events: none;
    }

    .overlay-menu nav ul li.nav-category .nav-cat-label {
      font-size: clamp(0.65rem, 1.2vw, 0.85rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--aqua);
      display: inline-block;
      border-bottom: 1px solid var(--line);
      padding-bottom: 4px;
    }

    .overlay-menu nav ul li.nav-sub {
      margin: 10px 0;
    }

    .overlay-menu nav ul li.nav-sub a {
      font-size: clamp(1.4rem, 3.6vw, 2.2rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink);
      transition: color 0.3s ease;
      cursor: pointer;
    }

    .overlay-menu nav ul li.nav-sub a:hover {
      color: #5a3024;
    }

    .hero {
      width: min(1180px, calc(100% - 40px));
      min-height: calc(100vh - 100px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 36px 0 96px;
      position: relative;
      z-index: 1;
    }

    .hero p {
      margin: 0 0 14px;
      color: rgba(31, 26, 22, 0.75);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .hero h1 {
      width: fit-content;
      max-width: 100%;
      margin: 0;
      padding: 14px 22px 12px;
      border: 1px solid rgba(31, 26, 22, 0.18);
      border-radius: 18px;
      color: #241c18;
      background: rgba(255, 255, 255, 0.66);
      box-shadow: 0 20px 60px rgba(23, 32, 42, 0.12);
      font-size: clamp(2.1rem, 6vw, 5.7rem);
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
      animation: print-press 1.1s ease-out both;
    }

    .hero-subtitle {
      margin-top: 14px;
      margin-bottom: 0;
      color: rgba(31, 26, 22, 0.82);
      font-size: clamp(0.86rem, 1.4vw, 1rem);
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: none;
    }

    .hero-overline {
      margin: 0 0 12px;
      color: rgba(31, 26, 22, 0.8);
      font-size: clamp(0.82rem, 1.5vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .hero-home {
      align-items: center;
      text-align: center;
      min-height: auto;
    }

    .hero-home > .hero-overline,
    .hero-home > h1,
    .hero-home > .hero-subtitle {
      display: none;
    }

    .hero-home h1 {
      font-family: "Georgia", "Times New Roman", serif;
      font-weight: 700;
    }

    @keyframes banner-flow {
      0% { background-position: 0% 50%; transform: translateX(0); }
      50% { background-position: 100% 50%; transform: translateX(10px); }
      100% { background-position: 0% 50%; transform: translateX(0); }
    }

    @keyframes print-press {
      0% { opacity: 0; transform: translateY(12px) scale(0.995); filter: blur(0.8px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .hero-chat {
      align-items: stretch;
      padding: 24px 0 40px;
    }

    .hero-chat .hero-overline {
      margin-bottom: 8px;
    }

    .hero-chat h1 {
      white-space: normal;
      word-break: break-word;
      font-family: "Georgia", "Times New Roman", serif;
      margin-bottom: 10px;
    }

    .chat-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 10px;
    }

    .chat-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(252, 250, 244, 0.92);
      backdrop-filter: blur(14px);
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
    }

    .chat-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      flex-shrink: 0;
      border: 2px solid var(--ink);
      color: var(--aqua);
      background: var(--glass);
    }

    .chat-avatar img,
    .msg-avatar img {
      display: block;
      width: 74%;
      height: 74%;
      object-fit: contain;
    }

    .chat-header-info h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .chat-header-info p {
      margin: 2px 0 0;
      font-size: 12px;
      color: rgba(31, 26, 22, 0.6);
      text-transform: none;
      letter-spacing: normal;
    }

    .chat-header-info .header-user {
      font-size: 11px;
      color: var(--aqua);
      margin-top: 4px;
      font-weight: 700;
    }

    .chat-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--aqua);
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--aqua);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .chat-exit-btn {
      margin-left: 12px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }

    .chat-exit-btn:hover {
      background: rgba(31, 26, 22, 0.06);
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
      min-height: 200px;
      max-height: 420px;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 88%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.bot { align-self: flex-start; }

    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      flex-shrink: 0;
      border: 1px solid var(--line);
    }

    .message.bot .msg-avatar {
      border-color: var(--aqua);
      color: var(--aqua);
      background: var(--glass);
    }

    .message.user .msg-avatar {
      background: rgba(31, 26, 22, 0.08);
      color: var(--ink);
    }

    .msg-content { display: flex; flex-direction: column; gap: 3px; }
    .message.user .msg-content { align-items: flex-end; }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.bot .bubble {
      background: var(--glass);
      border: 1px solid var(--line);
      color: var(--ink);
      border-bottom-left-radius: 4px;
    }

    .message.user .bubble {
      background: var(--aqua);
      color: var(--white);
      border-bottom-right-radius: 4px;
    }

    .timestamp {
      font-size: 10px;
      color: rgba(31, 26, 22, 0.45);
      padding: 0 4px;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 10px 14px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      background: var(--line);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .input-area {
      display: flex;
      gap: 10px;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      margin-top: auto;
    }

    #userInput {
      flex: 1;
      background: var(--white);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    #userInput:focus { border-color: var(--aqua); }
    #userInput::placeholder { color: rgba(31, 26, 22, 0.4); }

    #sendBtn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--aqua);
      color: var(--white);
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #sendBtn:hover { transform: scale(1.08); }
    #sendBtn:active { transform: scale(0.95); }
    #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    .welcome {
      text-align: center;
      color: rgba(31, 26, 22, 0.45);
      font-size: 13px;
      margin-top: auto;
      padding: 10px;
    }

    .screen {
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .screen.hidden {
      display: none;
    }

    .register-card {
      width: 100%;
      max-width: 480px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px);
      padding: 28px;
      box-shadow: 0 24px 80px rgba(23, 32, 42, 0.14);
    }

    .register-card::before {
      content: "";
      display: block;
      width: 92px;
      height: 50px;
      margin: 0 auto 18px;
      background: url("assets/img/logo-sysem.png") center / contain no-repeat;
    }

    .register-badge {
      display: inline-block;
      padding: 4px 10px;
      border: 1px solid var(--line);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(31, 26, 22, 0.7);
      margin-bottom: 18px;
    }

    .register-card h1 {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 28px;
      line-height: 1.1;
      margin: 0 0 10px;
    }

    .register-card p {
      color: rgba(31, 26, 22, 0.75);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 20px;
    }

    .register-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
    }

    .register-input {
      width: 100%;
      background: var(--white);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }

    .register-input:focus {
      border-color: var(--aqua);
      box-shadow: 0 0 0 3px rgba(47, 74, 69, 0.12);
    }

    .register-input::placeholder {
      color: rgba(31, 26, 22, 0.35);
    }

    .register-actions {
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }

    .switch-mode-btn {
      width: 100%;
      margin-top: 10px;
      border: none;
      background: transparent;
      color: var(--aqua);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
    }

    .switch-mode-btn:hover {
      text-decoration: underline;
    }

    .primary-btn,
    .secondary-btn {
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .primary-btn {
      flex: 1;
      background: linear-gradient(135deg, var(--aqua), var(--accent));
      color: var(--white);
    }

    .secondary-btn {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .primary-btn:hover,
    .secondary-btn:hover {
      transform: translateY(-1px);
    }

    .register-note {
      margin-top: 16px;
      color: rgba(31, 26, 22, 0.5);
      font-size: 12px;
      line-height: 1.5;
    }

    .register-note:empty {
      display: none;
    }

    .error-text {
      min-height: 18px;
      color: #b33a2a;
      font-size: 12px;
      font-weight: 600;
    }

    .auth-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(244, 238, 223, 0.85);
      font-size: 0.72rem;
    }

    .auth-pill span {
      color: var(--ink);
      font-weight: 600;
    }

    .auth-pill button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 6px;
      font-size: 0.72rem;
      padding: 4px 8px;
      cursor: pointer;
      font-weight: 700;
      font-family: inherit;
    }

    @media (max-width: 620px) {
      .home {
        background-position: center top;
      }

      .topbar {
        width: min(100% - 28px, 1180px);
        min-height: 76px;
      }

      .brand, .nav-container {
        min-height: auto;
      }

      .hero {
        width: min(100% - 28px, 1180px);
        min-height: calc(100vh - 86px);
        padding-bottom: 64px;
      }

      .hero h1 {
        padding: 12px 14px 10px;
        white-space: normal;
      }

      .hero-chat h1 {
        font-size: clamp(1.4rem, 5vw, 2rem);
      }

      .register-card {
        padding: 22px;
      }

      .register-card h1 {
        font-size: 24px;
      }

      .chat-header {
        flex-wrap: wrap;
      }

      .chat-status {
        margin-left: 0;
        width: 100%;
      }

      .chat-exit-btn {
        margin-left: auto;
      }
    }

    @media (max-width: 480px) {
      .register-actions {
        flex-direction: column;
      }

      .message {
        max-width: 95%;
      }

      .chat-box {
        max-height: 320px;
      }
    }
  </style>
</head>
<body>
<main class="home">
  <header class="topbar" aria-label="Intestazione sito">
    <a class="brand" href="/" aria-label="Assistente AI SYSEM home">
      <span class="brand-logo"><img src="assets/img/logo-sysem.png" alt="Logo SYSEM"></span>
      <span class="brand-label"><strong>SYSEM</strong></span>
    </a>
    <div class="nav-container">
      <a class="sysem-back" id="siteBackLink" href="https://sysem.it/ai.html" aria-label="Rientra al sito SYSEM">Sito</a>
      <button class="nav-toggle" id="menuToggle" aria-label="Apri menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <div class="overlay-menu" id="overlayMenu">
    <nav>
      <ul>
        <li class="nav-sub"><a id="navHome">Home</a></li>
        <li class="nav-sub"><a id="navLogout" style="display:none">Esci</a></li>
      </ul>
    </nav>
  </div>

  <section class="hero hero-home screen" id="registerScreen">
    <p class="hero-overline"></p>
    <h1 id="authTitle">Accesso</h1>
    <p class="hero-subtitle" id="authDescription" style="margin-bottom: 20px;">
      Accedi con le credenziali abilitate.
    </p>

    <div class="register-card">
      <div class="register-badge" id="registerBadge">Accesso</div>

      <form class="register-form" id="registerForm">
        <div class="field-group" id="nameFieldGroup">
          <label class="field-label" for="registerName">Nome</label>
          <input
            class="register-input"
            type="text"
            id="registerName"
            maxlength="40"
            placeholder="Es. Marco"
            autocomplete="name"
          />
        </div>
        <div class="field-group">
          <label class="field-label" for="registerEmail">Email</label>
          <input
            class="register-input"
            type="email"
            id="registerEmail"
            maxlength="120"
            placeholder="nome@email.com"
            autocomplete="email"
          />
        </div>
        <div class="field-group">
          <label class="field-label" for="registerPassword">Password</label>
          <input
            class="register-input"
            type="password"
            id="registerPassword"
            minlength="8"
            placeholder="Almeno 8 caratteri"
            autocomplete="current-password"
          />
        </div>
        <div class="error-text" id="registerError"></div>
        <div class="register-actions">
          <button class="primary-btn" type="submit" id="submitAuthBtn">Registrati</button>
          <button class="secondary-btn" type="button" id="toggleModeBtn">Ho gia un account</button>
        </div>
        <button class="switch-mode-btn" type="button" id="switchModeBtn">
          Passa al login
        </button>
      </form>

      <div class="register-note" id="registerNote">

      </div>
    </div>
  </section>

  <section class="hero hero-chat screen hidden" id="chatScreen">
    <p class="hero-overline">SYSEM AI</p>
    <h1>Assistente tecnico</h1>

    <div class="chat-layout">
      <div class="chat-card">
        <div class="chat-header">
          <div class="chat-avatar"><img src="assets/img/logo-sysem.png" alt=""></div>
          <div class="chat-header-info">
            <h2 id="chatHeaderTitle">Assistente AI SYSEM</h2>
            <p id="chatHeaderSubtitle">Supporto tecnico per utility, normative e diagnostica</p>
            <div class="header-user" id="headerUser"></div>
          </div>
          <div class="chat-status">
            <div class="status-dot"></div>
            Online
          </div>
          <button class="chat-exit-btn" id="changeUserBtn" type="button">Esci</button>
        </div>

        <div class="chat-box" id="chatBox">
          <div class="welcome">Accedi o registrati per iniziare a parlare con l'assistente AI SYSEM.</div>
        </div>

        <div class="input-area">
          <input
            type="text"
            id="userInput"
            placeholder="Scrivi un messaggio..."
            autocomplete="off"
          />
          <button id="sendBtn">➤</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
const API_URL = window.location.origin + '/api';

const registerScreen = document.getElementById('registerScreen');
const chatScreen = document.getElementById('chatScreen');
const registerForm = document.getElementById('registerForm');
const registerName = document.getElementById('registerName');
const registerEmail = document.getElementById('registerEmail');
const registerPassword = document.getElementById('registerPassword');
const registerError = document.getElementById('registerError');
const changeUserBtn = document.getElementById('changeUserBtn');
const authTitle = document.getElementById('authTitle');
const authDescription = document.getElementById('authDescription');
const nameFieldGroup = document.getElementById('nameFieldGroup');
const submitAuthBtn = document.getElementById('submitAuthBtn');
const toggleModeBtn = document.getElementById('toggleModeBtn');
const switchModeBtn = document.getElementById('switchModeBtn');
const registerNote = document.getElementById('registerNote');
const registerBadge = document.getElementById('registerBadge');
const headerUser = document.getElementById('headerUser');
const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const menuToggle = document.getElementById('menuToggle');
const overlayMenu = document.getElementById('overlayMenu');
const navLogout = document.getElementById('navLogout');
const navHome = document.getElementById('navHome');
const siteBackLink = document.getElementById('siteBackLink');

let currentUser = null;
let authToken = null;
let welcomeShown = false;
let isLoginMode = false;

if (siteBackLink && window.location.hostname === '127.0.0.1') {
  siteBackLink.href = 'http://127.0.0.1:8123/ai.html';
}

menuToggle.addEventListener('click', () => {
  menuToggle.classList.toggle('active');
  overlayMenu.classList.toggle('active');
  document.body.style.overflow = overlayMenu.classList.contains('active') ? 'hidden' : '';
});

overlayMenu.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', () => {
    menuToggle.classList.remove('active');
    overlayMenu.classList.remove('active');
    document.body.style.overflow = '';
  });
});

navHome.addEventListener('click', () => {
  if (currentUser) {
    chatScreen.scrollIntoView({ behavior: 'smooth' });
  } else {
    registerScreen.scrollIntoView({ behavior: 'smooth' });
  }
});

navLogout.addEventListener('click', async () => {
  await fetch(`${API_URL}/auth/logout`, {
    method: 'POST',
    credentials: 'include'
  });
  currentUser = null;
  authToken = null;
  welcomeShown = false;
  chatBox.innerHTML = "<div class=\"welcome\">Accedi o registrati per iniziare a parlare con l'assistente AI SYSEM.</div>";
  userInput.value = '';
  registerName.value = '';
  registerEmail.value = '';
  registerPassword.value = '';
  registerError.textContent = '';
  headerUser.textContent = '';
  chatScreen.classList.add('hidden');
  registerScreen.classList.remove('hidden');
  setAuthMode(false);
  registerName.focus();
  updateUI();
});

userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) sendMessage();
});

registerForm.addEventListener('submit', (e) => {
  e.preventDefault();
  submitAuth();
});

toggleModeBtn.addEventListener('click', () => setAuthMode(!isLoginMode));
switchModeBtn.addEventListener('click', () => setAuthMode(!isLoginMode));

changeUserBtn.addEventListener('click', async () => {
  await fetch(`${API_URL}/auth/logout`, {
    method: 'POST',
    credentials: 'include'
  });
  currentUser = null;
  authToken = null;
  welcomeShown = false;
  chatBox.innerHTML = "<div class=\"welcome\">Accedi o registrati per iniziare a parlare con l'assistente AI SYSEM.</div>";
  userInput.value = '';
  registerName.value = '';
  registerEmail.value = '';
  registerPassword.value = '';
  registerError.textContent = '';
  headerUser.textContent = '';
  chatScreen.classList.add('hidden');
  registerScreen.classList.remove('hidden');
  setAuthMode(false);
  registerName.focus();
  updateUI();
});

function updateUI() {
  if (currentUser) {
    navLogout.style.display = '';
  } else {
    navLogout.style.display = 'none';
  }
}

function getTime() {
  return new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(text) {
  return text
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function setActiveUser(user) {
  currentUser = user;
  headerUser.textContent = `Accesso attivo: ${user.name} (${user.email})`;
  updateUI();
}

function openChat() {
  registerScreen.classList.add('hidden');
  chatScreen.classList.remove('hidden');

  if (!welcomeShown) {
    chatBox.innerHTML = '';
    const displayName = currentUser?.name || 'amico';
    const isFamilyMode = currentUser?.audience_mode === 'family';
    const welcomeText = isFamilyMode
      ? `Ciao ${displayName}! Parliamo pure con naturalezza.`
      : `Ciao ${displayName}! Possiamo parlare di firmware, embedded, AI applicata e sviluppo software.`;
    setTimeout(() => {
      addMessage(welcomeText, 'bot');
    }, 350);
    welcomeShown = true;
  }

  setTimeout(() => userInput.focus(), 100);
}

function setAuthMode(loginMode) {
  isLoginMode = loginMode;
  authTitle.textContent = loginMode ? "Accedi" : "Accesso";
  authDescription.textContent = loginMode
    ? 'Inserisci email e password.'
    : 'Accedi con le credenziali abilitate.';
  submitAuthBtn.textContent = loginMode ? 'Accedi' : 'Registrati';
  toggleModeBtn.textContent = loginMode ? 'Crea un nuovo account' : 'Ho gia un account';
  switchModeBtn.textContent = loginMode ? 'Passa alla registrazione' : 'Passa al login';
  registerBadge.textContent = 'Accesso';
  registerNote.textContent = '';
  nameFieldGroup.style.display = loginMode ? 'none' : 'flex';
  registerName.required = !loginMode;
  registerPassword.autocomplete = loginMode ? 'current-password' : 'new-password';
  registerError.style.color = '#b33a2a';
  registerError.textContent = '';
}

async function submitAuth() {
  const payload = {
    name: registerName.value.trim(),
    email: registerEmail.value.trim(),
    password: registerPassword.value
  };

  if (!payload.email) {
    registerError.textContent = 'Inserisci una email valida.';
    registerEmail.focus();
    return;
  }

  if (payload.password.length < 8) {
    registerError.textContent = 'La password deve avere almeno 8 caratteri.';
    registerPassword.focus();
    return;
  }

  if (!isLoginMode && !payload.name) {
    registerError.textContent = 'Inserisci anche il tuo nome.';
    registerName.focus();
    return;
  }

  registerError.textContent = '';
  submitAuthBtn.disabled = true;

  try {
    const endpoint = isLoginMode ? 'login' : 'signup';
    const res = await fetch(`${API_URL}/auth/${endpoint}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.detail || `Errore ${res.status}`);
    }

    if (data.requires_confirmation) {
      setAuthMode(true);
      registerError.style.color = '#2f4a45';
      registerError.textContent = data.message;
      return;
    }

    registerError.style.color = '#b33a2a';
    setActiveUser(data.user);
    registerPassword.value = '';
    openChat();
  } catch (err) {
    registerError.style.color = '#b33a2a';
    registerError.textContent = err.message || 'Accesso non riuscito.';
    console.error(err);
  } finally {
    submitAuthBtn.disabled = false;
  }
}

function addMessage(text, sender) {
  const div = document.createElement('div');
  div.className = `message ${sender}`;
  div.innerHTML = `
    <div class="msg-avatar">${sender === 'bot' ? '<img src="assets/img/logo-sysem.png" alt="">' : 'U'}</div>
    <div class="msg-content">
      <div class="bubble">${escapeHtml(text)}</div>
      <span class="timestamp">${getTime()}</span>
    </div>`;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'message bot';
  div.id = 'typing';
  div.innerHTML = `
    <div class="msg-avatar"><img src="assets/img/logo-sysem.png" alt=""></div>
    <div class="typing-indicator">
      <span></span><span></span><span></span>
    </div>`;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || !currentUser) return;

  addMessage(text, 'user');
  userInput.value = '';
  sendBtn.disabled = true;
  showTyping();

  try {
    const headers = { 'Content-Type': 'application/json' };
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    const res = await fetch(`${API_URL}/chat`, {
      method: 'POST',
      headers,
      credentials: 'include',
      body: JSON.stringify({ text, user: currentUser })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `Errore ${res.status}`);
    if (data.audience_mode && currentUser) {
      currentUser.audience_mode = data.audience_mode;
    }
    removeTyping();
    addMessage(data.response, 'bot');
  } catch (err) {
    removeTyping();
    addMessage(err.message || 'Problema di connessione. Il server e attivo?', 'bot');
    console.error(err);
  } finally {
    sendBtn.disabled = false;
    userInput.focus();
  }
}

async function tryTokenLogin() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const email = params.get('email');
  if (!token || !email) return false;
  try {
    const res = await fetch(`${API_URL}/auth/me`, {
      headers: { 'Authorization': `Bearer ${token}` },
      credentials: 'include'
    });
    const data = await res.json();
    if (data.authenticated && data.user) {
      if (window.history.replaceState) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      authToken = token;
      setActiveUser(data.user);
      openChat();
      return true;
    }
  } catch (err) {
    console.error(err);
  }
  return false;
}

window.onload = async () => {
  const embedMode = document.documentElement.classList.contains('embed-mode');
  if (embedMode) {
    document.title = 'Assistente AI SYSEM';
    const chatTitle = document.getElementById('chatHeaderTitle');
    const chatSubtitle = document.getElementById('chatHeaderSubtitle');
    if (chatTitle) chatTitle.textContent = 'Assistente AI';
    if (chatSubtitle) chatSubtitle.textContent = 'Supporto tecnico SYSEM per utility, normative e diagnostica';
  }

  setAuthMode(false);
  updateUI();

  try {
    const res = await fetch(`${API_URL}/auth/me`, {
      credentials: 'include'
    });
    const data = await res.json();
    if (data.authenticated && data.user) {
      setActiveUser(data.user);
      openChat();
      return;
    }
  } catch (err) {
    console.error(err);
  }

  if (await tryTokenLogin()) return;

  registerName.focus();
};
</script>
</body>
</html>
